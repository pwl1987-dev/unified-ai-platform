# ---------------------------------------------------------------------------
# 功耗墙（冻结，不改）
# MASTER §6.1 写"历史基准以 450W 为主"，但现场 8 卡（含运行 11 天的生产卡）统一
# 250W，且历史 raw 证据无任何功耗墙修改记录——历史锚点事实运行于 250W 常态。
# 按单变量原则本战役冻结 250W 不变；该差异写入 phase-00 报告勘误。
power_wall:
  limit_w: 250
  policy: frozen_no_change
  discrepancy_note: "MASTER-TEST-PLAN §6.1.5 '450W 为主' 与现场 250W 常态不符；以现场为准，不改硬件设置"

# ---------------------------------------------------------------------------
# 热窗口（机器定义，每正式 arm 前必须 thermal-ready）
thermal_protocol:
  idle_temp_window_c: [25, 40]
  max_deviation_from_baseline_c: 5
  ready_requires_consecutive_s: 30
  max_cooldown_wait_s: 600
  cooldown_timeout_action: ABORTED
  re_thermal_after_arms: ["P220K", "P238K"]   # 重负载臂后必须重新进入 thermal-ready
  warmup_cache_salt_namespace: "warmup"        # warmup 独立 salt 命名空间，防预热正式 prompt
  formal_cache_salt_namespace: "formal"

# ---------------------------------------------------------------------------
# 采样冻结（0.28/0.29 不得自行变化）
sampling_protocol:
  metrics_endpoint_interval_ms: 100
  nvml_interval_ms: 500
  missing_sample_ratio_max: 0.05
  sampler_exit_code_required: 0

