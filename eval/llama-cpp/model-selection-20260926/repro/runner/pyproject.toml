[project]
name = "llama-bench-runner"
version = "0.1.0"
description = "CPU-only benchmark harness for llama.cpp model selection (talks OpenAI-compatible HTTP only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "numpy>=2.0",
    "gguf>=0.10",
    "huggingface_hub>=0.34",
    "pillow>=10.4",
]

[tool.uv]
# CPU-only harness; no GPU access needed
